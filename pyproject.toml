[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-character-chat"
version = "0.3.0"
description = "A learning scaffold for an open-source AI character chat system."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "zwsss152" }]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_character_chat = ["data/characters/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
